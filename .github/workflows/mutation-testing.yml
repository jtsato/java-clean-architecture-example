name: Mutation Testing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mutation-testing.yml
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mutation-testing:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build modules
        run: mvn -B -DskipTests clean install

      - name: Mutation testing
        run: mvn -B pitest:mutationCoverage

      - name: Publish mutation reports
        run: |
          rm -rf docs/mutation-reports/core docs/mutation-reports/sql docs/mutation-reports/rest
          mkdir -p docs/mutation-reports/core docs/mutation-reports/sql docs/mutation-reports/rest
          cp -R core/target/mutation-report/. docs/mutation-reports/core/
          cp -R infra/sql/target/mutation-report/. docs/mutation-reports/sql/
          cp -R entrypoints/rest/target/mutation-report/. docs/mutation-reports/rest/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mutation reports
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/mutation-reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
