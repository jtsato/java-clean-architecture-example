name: Continuous Testing

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Show versions
        run: | 
          java -version
          mvn -v

      - name: Build and Test Core Layer
        run: mvn -B clean verify -pl core

      - name: Build and Test Infrastructure Layer
        run: mvn -B verify -pl infra/sql -am

      - name: Build and Test Entrypoint Layer
        run: mvn -B verify -pl entrypoints/rest -am

      - name: Build and Test Configuration Layer
        run: mvn -B verify -pl configuration -am

  sonar-analysis:
    needs: build-and-test
    uses: ./.github/workflows/sonar-analysis.yml
    secrets: inherit
